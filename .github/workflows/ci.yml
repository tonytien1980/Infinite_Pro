name: Static readiness

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: static-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODEL_PROVIDER: mock
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run complete static readiness gate
        run: python backend/scripts/run_release_readiness.py --tier static
